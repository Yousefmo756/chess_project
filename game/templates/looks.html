{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: Arial, sans-serif;
        }

        .chessboard {
            width: 640px;
            height: 640px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #111;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            cursor: pointer;
            user-select: none;
        }

        .light {
            background-color: #f0d9b5;
        }

        .dark {
            background-color: #b58863;
        }

        .square:hover {
            outline: 3px solid yellow;
            outline-offset: -3px;
        }
        
    </style>
<script src="{% static 'movement.js' %}" defer></script></head>

<body>
<button onclick="create_game()">new game</button>
    <div class="chessboard">


    </div>

</body>
</html>
